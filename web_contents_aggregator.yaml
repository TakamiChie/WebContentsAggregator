description: Collect web contents, then download transcripts after successful collection.
type: graph
# Every day at 00:10-03:10, 07:10-11:10, 14:10-18:10, and 22:10 JST
# (UTC+09:00), 15 runs per day.
schedule: "CRON_TZ=UTC 10 0-2,5-9,13,15-18,22-23 * * *"
# Keep this YAML at the project root. If copied elsewhere, set the project path here.
working_dir: .

# Resolve the token from the Dagu host process and inject it into every step.
# Dagu masks values declared as secrets in logs and run metadata.
secrets:
  - name: NOTION_TOKEN
    provider: env
    key: NOTION_TOKEN

steps:
  - id: generate_all
    run: php src/generate_all.php

  - id: get_transcript
    run: php src/get_transcript.php
    depends:
      - generate_all

  - id: summarize
    run: php src/summarize.php
    depends:
      - get_transcript

  - id: classify_topics
    run: php src/classify_topics.php
    depends:
      - summarize

  - id: upload_database
    run: php src/upload_database.php
    depends:
      - classify_topics

  - id: upload_notion
    run: php src/upload_notion.php
    depends:
      - upload_database
